<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Claire's Corner</title>
    <style>
        :root {
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            color: #253147;
            background: #f6f4fb
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            box-sizing: border-box
        }

        .panel {
            background: white;
            border-radius: 20px;
            padding: 36px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 10px 35px #342c6217;
            box-sizing: border-box
        }

        h1 {
            margin: 0 0 8px;
            color: #593c87
        }

        p {
            color: #647087
        }

        a.tile {
            display: block;
            text-decoration: none;
            color: #392764;
            background: #f2ecfb;
            border: 1px solid #e1d5f3;
            border-radius: 14px;
            padding: 20px;
            margin-top: 24px;
            font-weight: 700
        }

        a.tile:hover {
            background: #e9dffa
        }

        small {
            display: block;
            color: #647087;
            font-weight: 400;
            margin-top: 6px
        }
    </style>
</head>

<body>
    <main class="panel">
        <h1>Claire's Corner</h1>
        <p>Helpful things, all in one place.</p>
        <a class="tile" href="driversed.html">🚗 Driver's Ed
            Countdown<small>Track your progress toward your permit.</small></a>

            <small>Test your knowledge of the periodic table.</small></a>
